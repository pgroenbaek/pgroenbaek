name: Update README cards

on:
  schedule:
    - cron: "0 0 * * 0" # Runs once weekly sunday at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate darkmode stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark_dimmed
          path: profile/stats-darkmode.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=default&size_weight=0.5&count_weight=0.5&langs_count=8&exclude_repo=sdu-sb5-mai&hide=Jupyter%20Notebook%2CJava%2CPHP%2CTeX%2CMDX%2CHTML%2CCSS
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate darkmode top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark_dimmed&size_weight=0.5&count_weight=0.5&langs_count=8&exclude_repo=sdu-sb5-mai&hide=Jupyter%20Notebook%2CJava%2CPHP%2CTeX%2CMDX%2CHTML%2CCSS
          path: profile/top-langs-darkmode.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push